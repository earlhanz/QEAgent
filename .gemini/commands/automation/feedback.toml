description = "Apply human feedback to the automation phase and return it to review."
prompt = """
The first argument is the project slug; the remaining text is the user's feedback. Validate that the slug is a single folder name (letters, numbers, underscore, hyphen). Reopen the automation gate with only the slug, never the feedback text: `node .gemini/tools/helpers/qe-state.js reopen <project> automation automation-feedback`.

Apply the feedback only to the selected project's automation code, automation test data, any user-approved service virtualization, and their traceability rows. Do not change approved analysis or manual artifacts; if the feedback requires that, stop and name the correct feedback command. Do not create new virtualization unless the user explicitly agrees. After the updates, rerun `automated-test-reviewer`. It saves `docs/<project>/reviews/automation-test-review.md` and records its status. Then run `node .gemini/tools/qe-workflow.js prepare automation <project>` only when the reviewer is ready. Stop for human review. Do not claim approval.
"""
