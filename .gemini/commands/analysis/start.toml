description = "Run project analysis and prepare a QE strategy and traceable test scenarios."
prompt = """
Run QE-Architect for the already selected and initialized project `{{args}}`. If project state or its source folders are missing, stop and explain how to use `/qe:create <project>` first. Treat the supplied design document as the sole source of expected behavior and test scenarios. Requirements/stories may clarify scope only, never add behaviors absent from design. Inspect only the selected project's relevant files. Create or update `docs/<project>/strategy/QE-strategy.md`, `strategy/test-scenarios.json`, and both sheets of the traceability workbook. The strategy must state whether service virtualization is recommended. Then run `node .gemini/tools/qe-workflow.js prepare analysis {{args}}`; if it fails, report blockers and do not claim the phase is ready. Present artifacts and fingerprint, design coverage, assumptions, conflicts, and gaps for human review. Stop before manual test generation. Do not proceed without `/analysis:approve <project>`.
"""
